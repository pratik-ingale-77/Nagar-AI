<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagar-AI | Smart Civic India</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
      overflow-x: hidden;
    }

    /* ================= INTRO ANIMATION ================= */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(135deg, #071b3a, #123c72);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: introBackground 1s ease 2.8s forwards;
      pointer-events: none;
    }

    .flag-wrapper {
      width: 210px;
      height: 140px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: flagMove 2.4s cubic-bezier(.65, 0, .35, 1) 0.5s forwards;
    }

    .flag {
      width: 100%;
      height: 100%;
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      transform-origin: center;
      animation: flagWave .7s ease-in-out infinite alternate;
    }

    .saffron {
      height: 33.33%;
      background: #ff9933;
    }

    .white {
      height: 33.33%;
      background: #fff;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .green {
      height: 33.33%;
      background: #138808;
    }

    .chakra {
      width: 42px;
      height: 42px;
      border: 3px solid #000080;
      border-radius: 50%;
      position: relative;
    }

    .chakra::before,
    .chakra::after {
      content: "";
      position: absolute;
      inset: 50%;
      width: 3px;
      height: 100%;
      background: #000080;
      transform-origin: center;
    }

    .chakra::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .chakra::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .intro-text {
      position: absolute;
      top: calc(50% + 100px);
      color: white;
      text-align: center;
      opacity: 0;
      animation: textAppear 1s ease .8s forwards;
    }

    .intro-text h1 {
      font-size: 38px;
      letter-spacing: 2px;
    }

    .intro-text p {
      margin-top: 8px;
      opacity: .85;
    }

    @keyframes flagMove {
      0% {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(1);
      }

      55% {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(.8);
      }

      100% {
        left: calc(100% - 65px);
        top: 32px;
        transform: translate(-50%, -50%) scale(.28);
        opacity: 0;
      }
    }

    @keyframes flagWave {
      from {
        transform: rotate(-1deg);
      }
      to {
        transform: rotate(1deg);
      }
    }

    @keyframes textAppear {
      to {
        opacity: 1;
      }
    }

    @keyframes introBackground {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(12px);

      display: flex;

      align-items: center;
    }

    .brand {

    }

    .mini-flag {
      width: 38px;

      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .mini-flag div {

    }

    .brand h1 {

    }

    .brand span {

    }

    .status {
      font-size: 13px;
      color: #15803d;
      background: #dcfce7;
      padding: 7px 12px;

    }

    /* ================= HERO ================= */

    }

    .hero-content {
      max-width: 650px;
    }

    .badge {
      display: inline-block;
      background: #fff3e6;
      color: #e66b00;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .hero h2 {

      color: #102a43;
    }

    .hero h2 span {
      color: #2563eb;
    }

    .hero p {
      margin-top: 20px;
      color: #64748b;
      font-size: 18px;
      line-height: 1.6;
    }

    .hero-art {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 25px 60px rgba(37,99,235,.18);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 100px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      50% {
        transform: translateY(-12px);
      }
    }

    /* ================= MAIN ================= */

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 45px 20px;
    }

    .section-title {
      text-align: center;

    }

    .section-title h2 {
      font-size: 30px;
    }

    .section-title p {
      color: #64748b;

    }

    .card {
      background: rgba(255,255,255,.9);
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 22px;
      box-shadow: 0 12px 35px rgba(15,23,42,.06);
    }

    .card h3 {
      margin-bottom: 18px;
    }

      text-align: center;
      background: #f8fbff;
    }

    .upload-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
