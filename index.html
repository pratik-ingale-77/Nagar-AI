/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}


/* =========================================================
   INTRO SCREEN
========================================================= */

#intro{
  position:fixed;
  inset:0;
  z-index:99999;
  background:
    radial-gradient(circle at 50% 45%,#174f91 0%,#0a2b52 45%,#041528 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  animation:introDisappear 1s ease 4.8s forwards;
}

.intro-glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  filter:blur(30px);
}

.intro-flag{
  position:absolute;
  width:300px;
  height:200px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  animation:flagMove 3.7s cubic-bezier(.65,0,.35,1) .35s forwards;
}

.flag{
  width:100%;
  height:100%;
  border-radius:6px;
  overflow:hidden;
  box-shadow:
    0 20px 55px rgba(0,0,0,.45),
    0 0 30px rgba(255,255,255,.08);
  position:relative;
}

.saffron{
  height:33.333%;
  background:#FF9933;
}

.white{
  height:33.333%;
  background:#fff;
  position:relative;
}

.green{
  height:33.333%;
  background:#138808;
}
