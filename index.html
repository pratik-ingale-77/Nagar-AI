/* =========================
   INDIAN FLAG SVG
========================= */

.flag{
  position:relative;
  width:100%;
  aspect-ratio:3/2;
  overflow:hidden;
  border-radius:5px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.flag .saffron{
  height:33.333%;
  background:#FF9933;
}

.flag .white{
  height:33.333%;
  background:#fff;
  position:relative;
}

.flag .green{
  height:33.333%;
  background:#138808;
}

.chakra{
  position:absolute;
  width:32%;
  aspect-ratio:1;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:3px solid #000080;
  border-radius:50%;
}

.chakra i{
  position:absolute;
  left:50%;
  top:50%;
  width:2px;
  height:46%;
  background:#000080;
  transform-origin:50% 0;
}

.chakra i:nth-child(1){transform:translate(-50%,0) rotate(0deg)}
.chakra i:nth-child(2){transform:translate(-50%,0) rotate(15deg)}
.chakra i:nth-child(3){transform:translate(-50%,0) rotate(30deg)}
.chakra i:nth-child(4){transform:translate(-50%,0) rotate(45deg)}
.chakra i:nth-child(5){transform:translate(-50%,0) rotate(60deg)}
.chakra i:nth-child(6){transform:translate(-50%,0) rotate(75deg)}
.chakra i:nth-child(7){transform:translate(-50%,0) rotate(90deg)}
.chakra i:nth-child(8){transform:translate(-50%,0) rotate(105deg)}
.chakra i:nth-child(9){transform:translate(-50%,0) rotate(120deg)}
.chakra i:nth-child(10){transform:translate(-50%,0) rotate(135deg)}
.chakra i:nth-child(11){transform:translate(-50%,0) rotate(150deg)}
.chakra i:nth-child(12){transform:translate(-50%,0) rotate(165deg)}
.chakra i:nth-child(13){transform:translate(-50%,0) rotate(180deg)}
.chakra i:nth-child(14){transform:translate(-50%,0) rotate(195deg)}
.chakra i:nth-child(15){transform:translate(-50%,0) rotate(210deg)}
.chakra i:nth-child(16){transform:translate(-50%,0) rotate(225deg)}
.chakra i:nth-child(17){transform:translate(-50%,0) rotate(240deg)}
.chakra i:nth-child(18){transform:translate(-50%,0) rotate(255deg)}
.chakra i:nth-child(19){transform:translate(-50%,0) rotate(270deg)}
.chakra i:nth-child(20){transform:translate(-50%,0) rotate(285deg)}
.chakra i:nth-child(21){transform:translate(-50%,0) rotate(300deg)}
.chakra i:nth-child(22){transform:translate(-50%,0) rotate(315deg)}
.chakra i:nth-child(23){transform:translate(-50%,0) rotate(330deg)}
.chakra i:nth-child(24){transform:translate(-50%,0) rotate(345deg)}

.chakra::after{
  content:"";
  position:absolute;
  width:10%;
  aspect-ratio:1;
  border-radius:50%;
  background:#000080;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* =========================
   INTRO ANIMATION
========================= */

#intro{
  position:fixed;
  inset:0;
  z-index:99999;
  background:
    radial-gradient(circle,#16569a,#08284d 55%,#031525);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  animation:introOut .8s ease 5s forwards;
}

.intro-flag{
  position:absolute;
  width:300px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  animation:flagFly 4s cubic-bezier(.65,0,.35,1) .4s forwards;
}

.intro-title{
  position:absolute;
  top:67%;
  width:100%;
  text-align:center;
  color:white;
  opacity:0;
  animation:titleIn 1s ease 1.1s forwards;
}

.intro-title h1{
  font-size:52px;
  letter-spacing:3px;
}

.intro-title p{
  margin-top:10px;
  color:#dbeafe;
}

@keyframes flagFly{
  0%{
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(1);
  }

  55%{
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.72) rotate(2deg);
  }

  100%{
    left:calc(100% - 55px);
    top:32px;
    transform:translate(-50%,-50%) scale(.22) rotate(0);
  }
}

@keyframes titleIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes introOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}

/* =========================
   NAVBAR
========================= */

.navbar{
  position:sticky;
  top:0;
  z-index:5000;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #e5e7eb;
  padding:13px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo-flag{
  width:48px;
  flex-shrink:0;
}

.brand-name{
  font-size:25px;
  font-weight:800;
  color:#123c72;
}

.brand-name span{
  color:#f97316;
}

.online{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  color:#15803d;
  padding:8px 14px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
}

.online-dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#22c55e;
  border-radius:50%;
  margin-right:6px;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:470px;
  padding:75px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:50px;
  background:
    radial-gradient(circle at 85% 20%,#dbeafe,transparent 30%),
    radial-gradient(circle at 10% 90%,#dcfce7,transparent 25%),
    linear-gradient(135deg,#fff,#eef5ff);
}

.hero-content{
  max-width:680px;
}

.badge{
  display:inline-block;
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#c2410c;
  padding:9px 15px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(42px,6vw,72px);
  line-height:1;
  letter-spacing:-2px;
}

.hero h1 span{
  color:#2563eb;
}

.hero p{
  margin-top:22px;
  color:#64748b;
  font-size:18px;
  line-height:1.7;
  max-width:620px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  margin-top:28px;
  flex-wrap:wrap;
}

.primary,
.secondary{
  padding:14px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.primary{
  background:#2563eb;
  color:white;
  box-shadow:0 10px 25px rgba(37,99,235,.25);
}

.secondary{
  background:white;
  border:1px solid #dbe2ea;
  color:#334155;
}

.primary:hover,
.secondary:hover{
  transform:translateY(-3px);
}

.city{
  width:280px;
  height:280px;
  border-radius:50%;
  background:linear-gradient(145deg,#fff,#e0edff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:100px;
  box-shadow:0 30px 70px rgba(37,99,235,.16);
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  50%{
    transform:translateY(-12px);
  }
}

/* =========================
   STATS
========================= */

.stats{
  max-width:1050px;
  margin:-28px auto 0;
  padding:0 20px;
  position:relative;
  z-index:10;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.stat{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:20px;
  box-shadow:0 15px 35px rgba(15,23,42,.07);
}

.stat strong{
  font-size:25px;
  color:#123c72;
}

.stat p{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

/* =========================
   MAIN
========================= */

.container{
  max-width:1050px;
  margin:auto;
  padding:65px 20px;
}

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  font-size:34px;
}

.section-title p{
  margin-top:8px;
  color:#64748b;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:23px;
  padding:30px;
  margin-bottom:23px;
  box-shadow:0 18px 45px rgba(15,23,42,.06);
}

.step{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.step-number{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  justify-content:center;

  font-weight:bold;
}

.step h3{
  font-size:19px;
}

/* =========================
   UPLOAD
========================= */

.upload-area{
  border:2px dashed #93c5fd;
  border-radius:20px;
  background:linear-gradient(135deg,#f8fbff,#eef6ff);
  padding:42px 22px;

  transition:.2s;

.upload-area:hover{
  border-color:#2563eb;

.upload-icon{
  width:72px;
  height:72px;
  border-radius:20px;

  align-items:center;

}

.upload-area h3{

}

.upload-area p{
  margin-top:8px;
  color:#64748b;

}

.file{
  width:100%;
  max-width:430px;
  margin-top:20px;
  padding:11px;
  background:white;
  border:1px solid #dbe2ea;
  border-radius:10px;
}

.preview{
  display:none;
  max-width:100%;
  max-height:320px;
  margin:22px auto 0;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}
